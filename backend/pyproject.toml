[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-me"
version = "0.1.0"
description = "Personal work-noise delegation agent for technical leads"
requires-python = ">=3.11,<3.14"
dependencies = [
    "aiosqlite>=0.21,<1",
    "alembic>=1.16,<2",
    "anthropic>=0.68,<1",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "keyring>=25,<26",
    "openai>=1.108,<2",
    "pydantic-settings>=2.10,<3",
    "pyyaml>=6,<7",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
    "types-PyYAML>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["aime"]
